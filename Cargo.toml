[package]
name = "teamtalk-xml-bot"
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15"
sha2 = "0.10"
quick-xml = { version = "0.31", features = ["serialize"] }
chrono = "0.4"
